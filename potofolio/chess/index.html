<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Chess Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #1e1e24;
      color: #fff;
      margin: 0;
    }

    #status {
      font-size: 1.4rem;
      margin-bottom: 20px;
      font-weight: bold;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 65px);
      grid-template-rows: repeat(8, 65px);
      border: 4px solid #444;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .square {
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      cursor: pointer;
      user-select: none;
    }

    .light {
      background-color: #f0d9b5;
    }

    .dark {
      background-color: #b58863;
    }

    .selected {
      background-color: #6a994e !important;
    }
  </style>
</head>

<body>

  <div id="status">Turn: White</div>
  <div id="board"></div>

  <script>
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");

    const pieceSymbols = {
      'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
      'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    let board = [
      ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
      ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
      ['', '', '', '', '', '', '', ''],
      ['', '', '', '', '', '', '', ''],
      ['', '', '', '', '', '', '', ''],
      ['', '', '', '', '', '', '', ''],
      ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
      ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
    ];

    let turn = 'white';
    let selectedCell = null;

    function isWhite(piece) { return piece && piece === piece.toUpperCase(); }
    function isBlack(piece) { return piece && piece === piece.toLowerCase(); }

    function renderBoard() {
      boardElement.innerHTML = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const square = document.createElement('div');
          const isLight = (r + c) % 2 === 0;
          square.className = `square ${isLight ? 'light' : 'dark'}`;

          const piece = board[r][c];
          if (piece) {
            square.textContent = pieceSymbols[piece] || '';
            square.style.color = isWhite(piece) ? '#ffffff' : '#000000';
            square.style.textShadow = isWhite(piece) ? '0 0 2px #000' : 'none';
          }

          if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
            square.classList.add('selected');
          }

          square.addEventListener('click', () => handleSquareClick(r, c));
          boardElement.appendChild(square);
        }
      }
    }

    function handleSquareClick(r, c) {
      const piece = board[r][c];

      if (selectedCell) {
        if (selectedCell.r === r && selectedCell.c === c) {
          selectedCell = null;
        } else if (canMove(selectedCell.r, selectedCell.c, r, c)) {
          board[r][c] = board[selectedCell.r][selectedCell.c];
          board[selectedCell.r][selectedCell.c] = '';
          selectedCell = null;
          turn = turn === 'white' ? 'black' : 'white';
          statusElement.textContent = `Turn: ${turn.charAt(0).toUpperCase() + turn.slice(1)}`;
        } else if (piece && isCurrentPlayerPiece(piece)) {
          selectedCell = { r, c };
        }
      } else {
        if (piece && isCurrentPlayerPiece(piece)) {
          selectedCell = { r, c };
        }
      }
      renderBoard();
    }

    function isCurrentPlayerPiece(piece) {
      return turn === 'white' ? isWhite(piece) : isBlack(piece);
    }

    function canMove(fromR, fromC, toR, toC) {
      const piece = board[fromR][fromC];
      const target = board[toR][toC];

      if (target && isCurrentPlayerPiece(target)) return false;

      const dr = toR - fromR;
      const dc = toC - fromC;
      const absDr = Math.abs(dr);
      const absDc = Math.abs(dc);
      const type = piece.toLowerCase();

      switch (type) {
        case 'p':
          const direction = isWhite(piece) ? -1 : 1;
          const startRow = isWhite(piece) ? 6 : 1;
          if (dc === 0 && dr === direction && !target) return true;
          if (dc === 0 && dr === 2 * direction && fromR === startRow && !target && !board[fromR + direction][fromC]) return true;
          if (absDc === 1 && dr === direction && target) return true;
          return false;

        case 'r':
          if (fromR !== toR && fromC !== toC) return false;
          return isPathClear(fromR, fromC, toR, toC);

        case 'n':
          return (absDr === 2 && absDc === 1) || (absDr === 1 && absDc === 2);

        case 'b':
          if (absDr !== absDc) return false;
          return isPathClear(fromR, fromC, toR, toC);

        case 'q':
          if (fromR !== toR && fromC !== toC && absDr !== absDc) return false;
          return isPathClear(fromR, fromC, toR, toC);

        case 'k':
          return absDr <= 1 && absDc <= 1;
      }
      return false;
    }

    function isPathClear(fromR, fromC, toR, toC) {
      const stepR = Math.sign(toR - fromR);
      const stepC = Math.sign(toC - fromC);
      let r = fromR + stepR;
      let c = fromC + stepC;

      while (r !== toR || c !== toC) {
        if (board[r][c] !== '') return false;
        r += stepR;
        c += stepC;
      }
      return true;
    }

    renderBoard();
  </script>
</body>

</html>
